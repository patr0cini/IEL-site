<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Fotografia da comunidade por adicionar</title>
  <desc id="desc">Um fundo abstrato em tons de verde para substituir temporariamente uma fotografia real da igreja.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#355f4c"/><stop offset="1" stop-color="#172b22"/></linearGradient>
    <pattern id="p" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="10" cy="10" r="1" fill="#fff" opacity=".12"/><circle cx="65" cy="42" r="1" fill="#fff" opacity=".1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#g)"/><rect width="1600" height="900" fill="url(#p)"/>
</svg>
